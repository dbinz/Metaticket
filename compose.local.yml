name: metaticket-local
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - search-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
    mem_limit: 2g
  search:
    build:
      context: ./metaticket-homebackend-master/metaticket-homebackend-master
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "48080"
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_SHOW_INDEX_NAME: local_shows
      API_KEY: local-development-only
      LOGGING_FILE_NAME: /tmp/metasearch.log
    ports:
      - "127.0.0.1:48080:48080"
    depends_on:
      elasticsearch:
        condition: service_healthy
volumes:
  search-data:
