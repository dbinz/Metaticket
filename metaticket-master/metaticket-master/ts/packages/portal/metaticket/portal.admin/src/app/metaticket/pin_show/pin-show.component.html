<nb-card [nbSpinner]="loading > 0">
    <nb-card-header>
        <div class="pin-head">
            <div>
                <div class="pin-title">Ghim sự kiện bán vé</div>
                <div class="pin-sub">10 vị trí banner. Đổi thứ tự / thay sự kiện trên bảng, rồi bấm Xác nhận.</div>
            </div>
            <div class="pin-actions">
                <button nbButton status="info" type="button" (click)="refresh()">Làm mới danh sách ghim</button>
                <button nbButton status="primary" type="button" [disabled]="!dirty" (click)="confirm()">Xác nhận</button>
            </div>
        </div>
    </nb-card-header>
    <nb-card-body>
        <table class="pin-table">
            <thead>
                <tr>
                    <th>Ảnh sự kiện</th>
                    <th>Sự kiện</th>
                    <th>Thể loại</th>
                    <th>Thứ tự Banner</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let row of rows">
                    <td>
                        <img *ngIf="imageOf(row.show)" class="thumb" [src]="imageOf(row.show)" [alt]="row.show?.showName" />
                        <span *ngIf="!row.show" class="muted">—</span>
                    </td>
                    <td>
                        <div *ngIf="row.show">{{ row.show.showName }}</div>
                        <small *ngIf="row.show">{{ row.show.code }}</small>
                        <span *ngIf="!row.show" class="muted">Chưa chọn</span>
                    </td>
                    <td>{{ row.show?.eventCategory || '—' }}</td>
                    <td>
                        <nb-select [selected]="row.pinOrder" (selectedChange)="onOrderChange(row, $event)">
                            <nb-option *ngFor="let n of orders" [value]="n">{{ n }}</nb-option>
                        </nb-select>
                    </td>
                    <td>
                        <button nbButton size="small" status="basic" type="button" (click)="replaceSlot(row)">
                            Thay thế
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </nb-card-body>
</nb-card>
