<nb-card [nbSpinner]="loading > 0" class="nb-card">
    <nb-card-body>
        <div class="w-100 flex-row">
            <label class="font-weight-bold mr-4">
                {{ draftPromotion || promotion ? 'Cập nhật' : 'Thêm' }} chương trình khuyến mãi
            </label>
            <nb-select
                class="w-100 flex-grow-1"
                placeholder="Thêm loại khuyến mãi"
                (selectedChange)="onPromotionItemChange($event)">
                <nb-option value="discountByDate">Khuyến mãi theo ngày</nb-option>
                <nb-option value="discountByTicketAmount">Khuyến mãi theo số lượng vé</nb-option>
                <nb-option value="discountByPriceCategoryAmount">Khuyến mãi theo số lượng từng loại vé</nb-option>
                <nb-option value="discountByPromotionCode">Khuyến mãi theo Coupon</nb-option>
                <nb-option value="discountByMultiPromotionCode">Khuyến mãi theo danh sách coupon</nb-option>
                <nb-option value="maxDiscountAmount">Giới hạn số tiền giảm giá tối đa</nb-option>
            </nb-select>
            <button class="ml-2" nbButton [disabled]="!promotionValue" (click)="onAddPromotionClick()">Thêm</button>
        </div>
        <div class="w-100">
            <form class="form-inline" [formGroup]="promotionForm" (ngSubmit)="onSubmit()">
                <div>
                    <label [ngClass]="{ error: name.invalid }">Tên chương trình khuyến mãi (*)</label>
                    <input
                        status="{{ name.invalid ? 'danger' : 'basic' }}"
                        formControlName="name"
                        required
                        fullWidth
                        nbInput
                        type="text" />
                </div>
                <ng-container formArrayName="items" class="w-100">
                    <ng-container *ngFor="let itemForm of getItems(); let index = index">
                        <nb-card class="mt-2">
                            <nb-card-body>
                                <div class="row mb-4">
                                    <label
                                        class="font-weight-bold"
                                        *ngIf="itemForm.get('type').value === 'discountByDate'"
                                        >Khuyến mãi theo ngày</label
                                    >
                                    <label
                                        class="font-weight-bold"
                                        *ngIf="itemForm.get('type').value === 'discountByTicketAmount'"
                                        >Khuyến mãi theo số lượng vé</label
                                    >
                                    <label
                                        class="font-weight-bold"
                                        *ngIf="itemForm.get('type').value === 'discountByPriceCategoryAmount'"
                                        >Khuyến mãi theo số lượng từng loại vé</label
                                    >
                                    <label
                                        class="font-weight-bold"
                                        *ngIf="itemForm.get('type').value === 'discountByPromotionCode'"
                                        >Khuyến mãi theo code</label
                                    >
                                    <label
                                        class="font-weight-bold"
                                        *ngIf="itemForm.get('type').value === 'discountByMultiPromotionCode'"
                                        >Khuyến mãi theo code</label
                                    >
                                    <label
                                        class="font-weight-bold"
                                        *ngIf="itemForm.get('type').value === 'maxDiscountAmount'"
                                        >Giới hạn số tiền giảm giá tối đa</label
                                    >
                                    <nb-icon class="ml-2" icon="trash-outline" (click)="removeItem(index)" />
                                </div>
                                <promotion-discount-by-date
                                    *ngIf="itemForm.get('type').value === 'discountByDate'"
                                    [index]="index"
                                    [formGroup]="itemForm"
                                    formGroupName="{{ index }}" />
                                <promotion-discount-by-ticket-amount
                                    *ngIf="itemForm.get('type').value === 'discountByTicketAmount'"
                                    [index]="index"
                                    [formGroup]="itemForm"
                                    formGroupName="{{ index }}" />
                                <promotion-discount-by-price-category-amount
                                    *ngIf="itemForm.get('type').value === 'discountByPriceCategoryAmount'"
                                    [index]="index"
                                    [formGroup]="itemForm"
                                    formGroupName="{{ index }}" />
                                <promotion-code
                                    *ngIf="itemForm.get('type').value === 'discountByPromotionCode'"
                                    [index]="index"
                                    [formGroup]="itemForm"
                                    formGroupName="{{ index }}" />
                                <multi-promotion-code
                                    *ngIf="itemForm.get('type').value === 'discountByMultiPromotionCode'"
                                    [index]="index"
                                    [formGroup]="itemForm"
                                    formGroupName="{{ index }}" />
                                <promotion-max-discount-amount
                                    *ngIf="itemForm.get('type').value === 'maxDiscountAmount'"
                                    [index]="index"
                                    [formGroup]="itemForm"
                                    formGroupName="{{ index }}" />
                            </nb-card-body>
                        </nb-card>
                    </ng-container>
                </ng-container>
                <div class="w-100">
                    <button type="button" status="primary" (click)="onSubmit()" class="button" nbButton>
                        {{ draftPromotion || promotion ? 'Cập nhật' : 'Thêm' }} khuyến mãi
                    </button>
                </div>
            </form>
        </div>
    </nb-card-body>
</nb-card>
