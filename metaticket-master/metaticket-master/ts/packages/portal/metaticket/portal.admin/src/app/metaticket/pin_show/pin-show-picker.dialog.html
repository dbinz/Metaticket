<nb-card class="picker" [nbSpinner]="loading">
    <nb-card-header>Chọn sự kiện cho thứ tự banner {{ pinOrder }}</nb-card-header>
    <nb-card-body>
        <div class="picker-filters">
            <input nbInput fullWidth placeholder="Tìm tên hoặc mã sự kiện" [(ngModel)]="keyword" (keyup.enter)="onSearch()" />
            <nb-select placeholder="Thể loại" [(selected)]="eventCategoryCode" (selectedChange)="onSearch()">
                <nb-option value="">Tất cả thể loại</nb-option>
                <nb-option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</nb-option>
            </nb-select>
            <button nbButton status="info" type="button" (click)="onSearch()">Tìm</button>
        </div>
        <table class="picker-table">
            <thead>
                <tr>
                    <th>Ảnh</th>
                    <th>Sự kiện</th>
                    <th>Thể loại</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of items">
                    <td>
                        <img class="thumb" [src]="item.thumbnailUrl || item.bannerImageUrl" [alt]="item.showName" />
                    </td>
                    <td>
                        <div>{{ item.showName }}</div>
                        <small>{{ item.code }}</small>
                    </td>
                    <td>{{ item.eventCategory }}</td>
                    <td>
                        <button nbButton size="small" status="primary" type="button" (click)="select(item)">Chọn</button>
                    </td>
                </tr>
                <tr *ngIf="!loading && items.length === 0">
                    <td colspan="4">Không có sự kiện</td>
                </tr>
            </tbody>
        </table>
        <div class="pager" *ngIf="totalPages > 0">
            <button nbButton size="small" type="button" [disabled]="page <= 1" (click)="load(page - 1)">Trước</button>
            <span>Trang {{ page }} / {{ totalPages }} ({{ totalElements }})</span>
            <button nbButton size="small" type="button" [disabled]="page >= totalPages" (click)="load(page + 1)">Sau</button>
        </div>
    </nb-card-body>
    <nb-card-footer>
        <button nbButton type="button" (click)="ref.close()">Đóng</button>
    </nb-card-footer>
</nb-card>
