<div class="div-inline">
    <div class="row">
        <label class="w-25" [ngClass]="{ error: nameFormControl.invalid }">Tên khuyến mãi (*)</label>
        <input
            class="w-75"
            status="{{ nameFormControl.invalid ? 'danger' : 'basic' }}"
            [formControl]="nameFormControl"
            required
            fullWidth
            nbInput
            type="text" />
    </div>
    <div class="row">
        <label [ngClass]="{ error: dateFormControl.invalid }" class="w-25">Ngày hết hiệu lực (*)</label>
        <input
            class="w-75"
            status="{{ dateFormControl.invalid ? 'danger' : 'basic' }}"
            [formControl]="dateFormControl"
            fullWidth
            nbInput
            [nbDatepicker]="datepicker" />
        <nb-datepicker #datepicker></nb-datepicker>
    </div>
    <div class="row">
        <div class="w-25">
            <label>Phương thức giảm(*)</label>
            <nb-radio-group [formControl]="discountOptionFormControl" name="radio-{{ index }}">
                <nb-radio name="radio-{{ index }}" *ngFor="let option of discountOptions" value="{{ option.value }}">
                    {{ option.label }}
                </nb-radio>
            </nb-radio-group>
        </div>
        <div class="w-75">
            <label>Giá giảm (*)</label>
            <nb-form-field>
                <input [formControl]="discountValueFormControl" required fullWidth nbInput type="number" />
                <label nbSuffix>{{ discountOptionFormControl.value === 'DiscountPercent' ? '%' : 'đ' }}</label>
            </nb-form-field>
        </div>
    </div>
</div>
