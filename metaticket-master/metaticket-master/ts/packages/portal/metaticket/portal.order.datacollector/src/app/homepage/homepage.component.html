<nav class="sticky top-0">
    <div class="flex justify-center bg-gray-200 w-full">
        <button class="inline-block py-2 px-4 text-blue-500 hover:text-blue-800 font-semibold w-full hover:bg-blue-100"
                *ngIf="showCat"
                routerLinkActive="!bg-gray-100 border-l border-t border-r rounded-t"
                routerLink="categories"
                ariaCurrentWhenActive="page"
        >Thông tin chung các hạng vé</button>
        <button class="inline-block py-2 px-4 text-blue-500 hover:text-blue-800 font-semibold w-full hover:bg-blue-200"
                routerLinkActive="!bg-gray-100 border-l border-t border-r rounded-t"
                routerLink="individual-tickets"
                ariaCurrentWhenActive="page"
        >Thông tin chi tiết từng vé</button>
    </div>
</nav>
<div class="px-[10px]">
    <router-outlet></router-outlet>
</div>
<nav class="sticky bottom-0 w-full">
    <div id="toast-success"
         *ngIf="saveAction$|async as res"
         [ngClass]="{'bg-green-50': res.success, 'bg-red-50': !res.success}"
         class="relative bottom-5 ml-auto mr-auto flex items-center w-full max-w-xs p-4 mb-4 text-gray-500 rounded-lg shadow dark:text-gray-400 dark:bg-gray-800" role="alert">
        <div
            [ngClass]="{'text-green-500 bg-green-100': res.success, 'text-red-500 bg-red-100': !res.success}"
            class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 rounded">
            <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3.707 8.207-4 4a1 1 0 0 1-1.414 0l-2-2a1 1 0 0 1 1.414-1.414L9 10.586l3.293-3.293a1 1 0 0 1 1.414 1.414Z"/>
            </svg>
            <span class="sr-only">Check icon</span>
        </div>
        <div class="ml-3 text-sm font-normal">{{res.message}}</div>
        <button type="button"
                (click)="saveAction$.next(undefined)"
                class="ml-auto -mx-1.5 -my-1.5 bg-white text-gray-400 hover:text-gray-900 rounded-lg focus:ring-2 focus:ring-gray-300 p-1.5 hover:bg-gray-100 inline-flex items-center justify-center h-8 w-8 dark:text-gray-500 dark:hover:text-white dark:bg-gray-800 dark:hover:bg-gray-700" data-dismiss-target="#toast-success" aria-label="Close">
            <span class="sr-only">Close</span>
            <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
            </svg>
        </button>
    </div>
    <button class="inline-block py-2 px-4 text-blue-500 hover:bg-blue-300 hover:text-blue-800 font-semibold border-b bg-gray-200 w-full"
            (click)="onSave()"
    >Lưu dữ liệu</button>
</nav>
