<div *ngIf="appS.fgData$|async as data">
    <div *ngFor="let kv of data.priceCategoriesFormGroup|keyvalue; index as catIdx">
        <div class="border mb-6" [class.border-red-500]="!kv.value.isValid">
            <h2 class="bg-blue-300">
                <button type="button" (click)="collapse('accordion-collapse-body-cat-', catIdx)"
                        class="flex items-center justify-between w-full p-5 font-medium text-left text-gray-500 bg-[#43B1E4] border border-b-0 border-gray-200 rounded-t focus:ring-4 focus:ring-gray-200 hover:bg-[#43B1FF]"
                >
                    <h2 class="font-semibold text-xl text-gray-950 uppercase">Hạng vé: {{kv.key}}</h2>
                    <svg data-accordion-icon class="w-3 h-3 rotate-180 shrink-0" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 10 6">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5 5 1 1 5"/>
                    </svg>
                </button>
            </h2>
            <div id="accordion-collapse-body-cat-{{catIdx}}" [class.hidden]="catIdx>0">
                <div class="p-6 bg-gray-100 flex items-center justify-center border-b-4 border-b-gray-200 rounded-b-lg shadow">
                    <div class="container max-w-screen-lg mx-auto">
                        <form-group [fg]="kv.value"></form-group>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
