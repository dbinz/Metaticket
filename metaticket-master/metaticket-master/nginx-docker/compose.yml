services:
  metaticket:
    container_name: metaticket
    image: nginx:latest
    volumes:
      - ../nginx/maintenance:/etc/nginx/metaticket-maintenance:ro
      - maintenance-state:/var/lib/metaticket/maintenance
      - ./dev.conf/templates:/etc/nginx/templates     # template files to be replaced
      - ./dev.conf/nginx.conf:/etc/nginx/nginx.conf   # use our own nginx.conf file
      - ./ssl:/etc/nginx/ssl  # ssl keys for metaticket domain
      - ../ts/homepage/dist/mt-ticket/browser:/homepage
      - ../ts/dist/metaticket:/metaticket
      - ../ts/local_modules/viclass:/viclass
    ports:
      - $NGINX_CONNECT_PORT:$NGINX_LISTEN_PORT

      - $EDITOR_POLICYDESC_BACKEND_CONNECT_PORT:$EDITOR_POLICYDESC_BACKEND_CONNECT_PORT
      - $EDITOR_SEATPLANNER_BACKEND_CONNECT_PORT:$EDITOR_SEATPLANNER_BACKEND_CONNECT_PORT
      - $SHOW_BACKEND_CONNECT_PORT:$SHOW_BACKEND_CONNECT_PORT
      - $TICKET_BACKEND_CONNECT_PORT:$TICKET_BACKEND_CONNECT_PORT
      - $ORDER_BACKEND_CONNECT_PORT:$ORDER_BACKEND_CONNECT_PORT
      - $PAYMENT_BACKEND_CONNECT_PORT:$PAYMENT_BACKEND_CONNECT_PORT
      - $ACCESSORY_BACKEND_CONNECT_PORT:$ACCESSORY_BACKEND_CONNECT_PORT
      - $JOBRUNR_BACKEND_CONNECT_PORT:$JOBRUNR_BACKEND_CONNECT_PORT
      - $NOTIFICATION_BACKEND_CONNECT_PORT:$NOTIFICATION_BACKEND_CONNECT_PORT
      - $ADMIN_API_BACKEND_CONNECT_PORT:$ADMIN_API_BACKEND_CONNECT_PORT
      - $QRCODE_BACKEND_CONNECT_PORT:$QRCODE_BACKEND_CONNECT_PORT
      - $TICKETSLOT_BACKEND_CONNECT_PORT:$TICKETSLOT_BACKEND_CONNECT_PORT
      - $AUTH_BACKEND_CONNECT_PORT:$AUTH_BACKEND_CONNECT_PORT
      - $CUSTOMER_AUTH_BACKEND_CONNECT_PORT:$CUSTOMER_AUTH_BACKEND_CONNECT_PORT
      - $CUSTOMER_USER_BACKEND_CONNECT_PORT:$CUSTOMER_USER_BACKEND_CONNECT_PORT
      - $HOMEPAGE_API_BACKEND_CONNECT_PORT:$HOMEPAGE_API_BACKEND_CONNECT_PORT
      - $NEWS_BACKEND_CONNECT_PORT:$NEWS_BACKEND_CONNECT_PORT
      - $WORDPRESS_CONNECT_PORT:$WORDPRESS_CONNECT_PORT

      - $KAFKA_CONNECT_PORT:$KAFKA_CONNECT_PORT
      - $MONGO_CONNECT_PORT:$MONGO_CONNECT_PORT
      - $REDIS_CONNECT_PORT:$REDIS_CONNECT_PORT

      # gRPC inter-service ports
      - $SHOW_GRPC_CONNECT_PORT:$SHOW_GRPC_CONNECT_PORT
      - $TICKET_GRPC_CONNECT_PORT:$TICKET_GRPC_CONNECT_PORT
      - $ORDER_GRPC_CONNECT_PORT:$ORDER_GRPC_CONNECT_PORT
      - $PAYMENT_GRPC_CONNECT_PORT:$PAYMENT_GRPC_CONNECT_PORT
      - $ACCESSORY_GRPC_CONNECT_PORT:$ACCESSORY_GRPC_CONNECT_PORT
      - $QRCODE_GRPC_CONNECT_PORT:$QRCODE_GRPC_CONNECT_PORT
      - $TICKETSLOT_GRPC_CONNECT_PORT:$TICKETSLOT_GRPC_CONNECT_PORT
      - $JOBRUNR_GRPC_CONNECT_PORT:$JOBRUNR_GRPC_CONNECT_PORT
      - $NOTIFICATION_GRPC_CONNECT_PORT:$NOTIFICATION_GRPC_CONNECT_PORT
      - $ADMIN_API_GRPC_CONNECT_PORT:$ADMIN_API_GRPC_CONNECT_PORT
      - $CUSTOMER_USER_GRPC_CONNECT_PORT:$CUSTOMER_USER_GRPC_CONNECT_PORT

    environment:
      - NGINX_ENVSUBST_TEMPLATE_SUFFIX=$NGINX_ENVSUBST_TEMPLATE_SUFFIX

      - METATICKET_REMOTE=$METATICKET_REMOTE             # ip address (vpn) of the dev machine
      # server_name expected by remote nginx when METATICKET_REMOTE is an IP (e.g. staging.metaticket.vn)
      - METATICKET_REMOTE_HOST=$METATICKET_REMOTE_HOST
      - METATICKET_LOCAL=$METATICKET_LOCAL               # location to connect to for local service

      - CONF_ROOT=$CONF_ROOT
      - CONF_ASSETS=$CONF_ASSETS

      - CONF_PORTAL_ADMIN=$CONF_PORTAL_ADMIN

      - CONF_PORTAL_SEATPLANNER=$CONF_PORTAL_SEATPLANNER

      - CONF_MODULE_WW=$CONF_MODULE_WW
      - CONF_MODULE_EDITOR_POLICYDESC=$CONF_MODULE_EDITOR_POLICYDESC
      - CONF_MODULE_EDITOR_SEATPLANNER=$CONF_MODULE_EDITOR_SEATPLANNER
      - CONF_MODULE_EDITOR_SEATPLANNER_UI=$CONF_MODULE_EDITOR_SEATPLANNER_UI
      - CONF_MODULE_VICLASS=$CONF_MODULE_VICLASS

      - CONF_EDITOR_POLICYDESC=$CONF_EDITOR_POLICYDESC
      - CONF_EDITOR_POLICYDESC_BACKEND=$CONF_EDITOR_POLICYDESC_BACKEND

      - CONF_EDITOR_SEATPLANNER=$CONF_EDITOR_SEATPLANNER
      - CONF_EDITOR_SEATPLANNER_BACKEND=$CONF_EDITOR_SEATPLANNER_BACKEND

      - CONF_HOMEPAGE_API=$CONF_HOMEPAGE_API
      - CONF_HOMEPAGE_API_BACKEND=$CONF_HOMEPAGE_API_BACKEND

      - CONF_NEWS=$CONF_NEWS
      - CONF_NEWS_BACKEND=$CONF_NEWS_BACKEND
      - CONF_NEWS_PRIVATE=$CONF_NEWS_PRIVATE

      - CONF_WORDPRESS=$CONF_WORDPRESS
      - CONF_WORDPRESS_BACKEND=$CONF_WORDPRESS_BACKEND

      - CONF_SHOW=$CONF_SHOW
      - CONF_SHOW_BACKEND=$CONF_SHOW_BACKEND

      - CONF_TICKET=$CONF_TICKET
      - CONF_TICKET_BACKEND=$CONF_TICKET_BACKEND

      - CONF_ORDER=$CONF_ORDER
      - CONF_ORDER_BACKEND=$CONF_ORDER_BACKEND

      - CONF_PAYMENT=$CONF_PAYMENT
      - CONF_PAYMENT_BACKEND=$CONF_PAYMENT_BACKEND

      - CONF_ACCESSORY=$CONF_ACCESSORY
      - CONF_ACCESSORY_BACKEND=$CONF_ACCESSORY_BACKEND

      - CONF_JOBRUNR=$CONF_JOBRUNR
      - CONF_JOBRUNR_BACKEND=$CONF_JOBRUNR_BACKEND

      - CONF_NOTIFICATION=$CONF_NOTIFICATION
      - CONF_NOTIFICATION_BACKEND=$CONF_NOTIFICATION_BACKEND

      - CONF_ADMIN_API=$CONF_ADMIN_API
      - CONF_ADMIN_API_BACKEND=$CONF_ADMIN_API_BACKEND

      - CONF_AUTH=$CONF_AUTH
      - CONF_AUTH_BACKEND=$CONF_AUTH_BACKEND

      - CONF_CUSTOMER_AUTH=$CONF_CUSTOMER_AUTH
      - CONF_CUSTOMER_AUTH_BACKEND=$CONF_CUSTOMER_AUTH_BACKEND

      - CONF_CUSTOMER_USER=$CONF_CUSTOMER_USER
      - CONF_CUSTOMER_USER_BACKEND=$CONF_CUSTOMER_USER_BACKEND

      - CONF_QRCODE=$CONF_QRCODE
      - CONF_QRCODE_BACKEND=$CONF_QRCODE_BACKEND

      - CONF_TICKETSLOT=$CONF_TICKETSLOT
      - CONF_TICKETSLOT_BACKEND=$CONF_TICKETSLOT_BACKEND

      - CONF_MONGO=$CONF_MONGO
      - CONF_KAFKA=$CONF_KAFKA
      - CONF_REDIS=$CONF_REDIS

      # gRPC config selectors (local / remote) per service
      - CONF_SHOW_GRPC=$CONF_SHOW_GRPC
      - CONF_TICKET_GRPC=$CONF_TICKET_GRPC
      - CONF_ORDER_GRPC=$CONF_ORDER_GRPC
      - CONF_PAYMENT_GRPC=$CONF_PAYMENT_GRPC
      - CONF_ACCESSORY_GRPC=$CONF_ACCESSORY_GRPC
      - CONF_QRCODE_GRPC=$CONF_QRCODE_GRPC
      - CONF_TICKETSLOT_GRPC=$CONF_TICKETSLOT_GRPC
      - CONF_JOBRUNR_GRPC=$CONF_JOBRUNR_GRPC
      - CONF_NOTIFICATION_GRPC=$CONF_NOTIFICATION_GRPC
      - CONF_ADMIN_API_GRPC=$CONF_ADMIN_API_GRPC
      - CONF_CUSTOMER_USER_GRPC=$CONF_CUSTOMER_USER_GRPC

      # BRING PORT IN THE ENV INTO THE DOCKER

      - NGINX_CONNECT_PORT=$NGINX_CONNECT_PORT
      - NGINX_LISTEN_PORT=$NGINX_LISTEN_PORT

      - EDITOR_POLICYDESC_BACKEND_LISTEN_PORT=$EDITOR_POLICYDESC_BACKEND_LISTEN_PORT
      - EDITOR_POLICYDESC_BACKEND_CONNECT_PORT=$EDITOR_POLICYDESC_BACKEND_CONNECT_PORT

      - EDITOR_SEATPLANNER_BACKEND_LISTEN_PORT=$EDITOR_SEATPLANNER_BACKEND_LISTEN_PORT
      - EDITOR_SEATPLANNER_BACKEND_CONNECT_PORT=$EDITOR_SEATPLANNER_BACKEND_CONNECT_PORT

      - HOMEPAGE_API_BACKEND_LISTEN_PORT=$HOMEPAGE_API_BACKEND_LISTEN_PORT
      - HOMEPAGE_API_BACKEND_CONNECT_PORT=$HOMEPAGE_API_BACKEND_CONNECT_PORT

      - NEWS_BACKEND_LISTEN_PORT=$NEWS_BACKEND_LISTEN_PORT
      - NEWS_BACKEND_CONNECT_PORT=$NEWS_BACKEND_CONNECT_PORT

      - WORDPRESS_LISTEN_PORT=$WORDPRESS_LISTEN_PORT
      - WORDPRESS_CONNECT_PORT=$WORDPRESS_CONNECT_PORT

      - SHOW_BACKEND_LISTEN_PORT=$SHOW_BACKEND_LISTEN_PORT
      - SHOW_BACKEND_CONNECT_PORT=$SHOW_BACKEND_CONNECT_PORT

      - TICKET_BACKEND_LISTEN_PORT=$TICKET_BACKEND_LISTEN_PORT
      - TICKET_BACKEND_CONNECT_PORT=$TICKET_BACKEND_CONNECT_PORT

      - ORDER_BACKEND_LISTEN_PORT=$ORDER_BACKEND_LISTEN_PORT
      - ORDER_BACKEND_CONNECT_PORT=$ORDER_BACKEND_CONNECT_PORT

      - PAYMENT_BACKEND_LISTEN_PORT=$PAYMENT_BACKEND_LISTEN_PORT
      - PAYMENT_BACKEND_CONNECT_PORT=$PAYMENT_BACKEND_CONNECT_PORT

      - ACCESSORY_BACKEND_LISTEN_PORT=$ACCESSORY_BACKEND_LISTEN_PORT
      - ACCESSORY_BACKEND_CONNECT_PORT=$ACCESSORY_BACKEND_CONNECT_PORT

      - JOBRUNR_BACKEND_LISTEN_PORT=$JOBRUNR_BACKEND_LISTEN_PORT
      - JOBRUNR_BACKEND_CONNECT_PORT=$JOBRUNR_BACKEND_CONNECT_PORT

      - NOTIFICATION_BACKEND_LISTEN_PORT=$NOTIFICATION_BACKEND_LISTEN_PORT
      - NOTIFICATION_BACKEND_CONNECT_PORT=$NOTIFICATION_BACKEND_CONNECT_PORT

      - ADMIN_API_BACKEND_LISTEN_PORT=$ADMIN_API_BACKEND_LISTEN_PORT
      - ADMIN_API_BACKEND_CONNECT_PORT=$ADMIN_API_BACKEND_CONNECT_PORT

      - AUTH_BACKEND_LISTEN_PORT=$AUTH_BACKEND_LISTEN_PORT
      - AUTH_BACKEND_CONNECT_PORT=$AUTH_BACKEND_CONNECT_PORT

      - CUSTOMER_AUTH_BACKEND_LISTEN_PORT=$CUSTOMER_AUTH_BACKEND_LISTEN_PORT
      - CUSTOMER_AUTH_BACKEND_CONNECT_PORT=$CUSTOMER_AUTH_BACKEND_CONNECT_PORT

      - CUSTOMER_USER_BACKEND_LISTEN_PORT=$CUSTOMER_USER_BACKEND_LISTEN_PORT
      - CUSTOMER_USER_BACKEND_CONNECT_PORT=$CUSTOMER_USER_BACKEND_CONNECT_PORT

      - QRCODE_BACKEND_LISTEN_PORT=$QRCODE_BACKEND_LISTEN_PORT
      - QRCODE_BACKEND_CONNECT_PORT=$QRCODE_BACKEND_CONNECT_PORT

      - TICKETSLOT_BACKEND_LISTEN_PORT=$TICKETSLOT_BACKEND_LISTEN_PORT
      - TICKETSLOT_BACKEND_CONNECT_PORT=$TICKETSLOT_BACKEND_CONNECT_PORT

      - MONGO_LISTEN_PORT=$MONGO_LISTEN_PORT
      - MONGO_CONNECT_PORT=$MONGO_CONNECT_PORT

      - REDIS_LISTEN_PORT=$REDIS_LISTEN_PORT
      - REDIS_CONNECT_PORT=$REDIS_CONNECT_PORT

      - KAFKA_CONNECT_PORT=$KAFKA_CONNECT_PORT
      - KAFKA_LISTEN_PORT=$KAFKA_LISTEN_PORT

      # gRPC LISTEN (actual gRPC server port) / CONNECT (host-exposed) ports

      - SHOW_GRPC_LISTEN_PORT=$SHOW_GRPC_LISTEN_PORT
      - SHOW_GRPC_CONNECT_PORT=$SHOW_GRPC_CONNECT_PORT

      - TICKET_GRPC_LISTEN_PORT=$TICKET_GRPC_LISTEN_PORT
      - TICKET_GRPC_CONNECT_PORT=$TICKET_GRPC_CONNECT_PORT

      - ORDER_GRPC_LISTEN_PORT=$ORDER_GRPC_LISTEN_PORT
      - ORDER_GRPC_CONNECT_PORT=$ORDER_GRPC_CONNECT_PORT

      - PAYMENT_GRPC_LISTEN_PORT=$PAYMENT_GRPC_LISTEN_PORT
      - PAYMENT_GRPC_CONNECT_PORT=$PAYMENT_GRPC_CONNECT_PORT

      - ACCESSORY_GRPC_LISTEN_PORT=$ACCESSORY_GRPC_LISTEN_PORT
      - ACCESSORY_GRPC_CONNECT_PORT=$ACCESSORY_GRPC_CONNECT_PORT

      - QRCODE_GRPC_LISTEN_PORT=$QRCODE_GRPC_LISTEN_PORT
      - QRCODE_GRPC_CONNECT_PORT=$QRCODE_GRPC_CONNECT_PORT

      - TICKETSLOT_GRPC_LISTEN_PORT=$TICKETSLOT_GRPC_LISTEN_PORT
      - TICKETSLOT_GRPC_CONNECT_PORT=$TICKETSLOT_GRPC_CONNECT_PORT

      - JOBRUNR_GRPC_LISTEN_PORT=$JOBRUNR_GRPC_LISTEN_PORT
      - JOBRUNR_GRPC_CONNECT_PORT=$JOBRUNR_GRPC_CONNECT_PORT

      - NOTIFICATION_GRPC_LISTEN_PORT=$NOTIFICATION_GRPC_LISTEN_PORT
      - NOTIFICATION_GRPC_CONNECT_PORT=$NOTIFICATION_GRPC_CONNECT_PORT

      - ADMIN_API_GRPC_LISTEN_PORT=$ADMIN_API_GRPC_LISTEN_PORT
      - ADMIN_API_GRPC_CONNECT_PORT=$ADMIN_API_GRPC_CONNECT_PORT

      - CUSTOMER_USER_GRPC_LISTEN_PORT=$CUSTOMER_USER_GRPC_LISTEN_PORT
      - CUSTOMER_USER_GRPC_CONNECT_PORT=$CUSTOMER_USER_GRPC_CONNECT_PORT

volumes:
  maintenance-state:
