# secretKey to encrypt/decrypt 16 bit
secretKey = "CHANGE_ME_16BYTE"
qrcodeSecretKey = "CHANGE_ME_QR_16B"

# database configuration
db {
    connection = "mongodb://localhost:47017"
    dbName = "metaticket"
    qrcodeColName = "qrcode"
}

qrscanner {
    linkBaseUrl = "https://admin.staging.metaticket.vn/qrcode/scanner"
}

# ktor configuration
ktor {

    deployment {
        port = 4010
    }

    application {
        modules = [ metaticket.qrcode.ApplicationKt.module ]
    }
}

grpc {
    server {
        port = 4110
    }
    channel {
        ticketSlotS {
            sid = "ticketSlotS01"
            host = "127.0.0.1"
            port = 4109
        }
        orderS {
            sid = "orderS01"
            host = "127.0.0.1"
            port = 4105
        }
    }
}
