# BFF must use HTTPS site URL — WP disables Application Passwords on plain HTTP
wordpress.base-url=https://news.staging.metaticket.vn/
wordpress.rest-path=/wp-json/wp/v2
wordpress.connect-timeout-ms=3000
wordpress.read-timeout-ms=10000
# Prefer env on server: WORDPRESS_USERNAME / WORDPRESS_APPLICATION_PASSWORD
wordpress.username=${WORDPRESS_USERNAME:}
wordpress.application-password=${WORDPRESS_APPLICATION_PASSWORD:}
news.public-base-url=https://staging.metaticket.vn/news/
news.media-base-url=https://news.staging.metaticket.vn/
news.internal-api-key=${NEWS_INTERNAL_API_KEY:}

# Align with nginx upstream news_service (staging)
server.port=4041

news.cache-ttl-seconds=120
news.frontend-base-url=https://staging.metaticket.vn/
news.render-cache-seconds=300
