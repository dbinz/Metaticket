
db {
  connection : "mongodb://localhost:47017"
  dbName : "metaticket"
  authInformationColName: "auth-information"
}

ktor {
  deployment {
    port = 4030
  }
  application {
    modules = [ metaticket.authentication.ApplicationKt.module ]
  }
}

bcrypt {
    # BCrypt salt: "$2a$10$" + 22 chars, e.g. from BCrypt.gensalt(10)
    salt: "CHANGE_ME"
}

rsaEncypt {
    # RSA-2048 key pair, Base64 DER on one line: privateKey = PKCS#8, publicKey = X.509
    privateKey: "CHANGE_ME"
    publicKey: "CHANGE_ME"

}

jwt {
    secret: "CHANGE_ME"
    issuer: "https://admin.staging.metaticket.vn"
    audience: "https://admin.staging.metaticket.vn"
    realm: "Access to 'authentication'"
    expiration_time: 129600000
}
