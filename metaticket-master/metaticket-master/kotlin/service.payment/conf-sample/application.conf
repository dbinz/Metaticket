# secretKey to encrypt/decrypt 16 bit
secretKey = "CHANGE_ME_16BYTE"

# database configuration
db {
  connection = "mongodb://localhost:47017"
  dbName = "metaticket"
  paymentColName = "payment"
  pgConfigColName = "pg-account-config"
}

jrunr {
    notifyOrder {
        paymentStatusChanged {
            retry = -1 # retry forever
        }
    }
    notifyPayment {
        inquiryNinePayPaymentStatus {
            intervalInSecond = 60
            maxTimeQueryForNotfoundInM = 30
        }
        inquiryVnPayPaymentStatus {
            intervalInSecond = 60
            maxTimeQueryForNotfoundInM = 30
        }
        inquiryOnePayPaymentStatus {
            intervalInSecond = 60
            maxTimeQueryForNotfoundInM = 30
        }
    }
}

ktor {
  deployment {
    port = 4006
  }
  application {
    modules = [ metaticket.payment.ApplicationKt.module ]
  }
}

grpc {
    server {
        port = 4106
    }
    channel {
        orderS {
            sid = "orderS01"
            host = "127.0.0.1"
            port = 4105
        }
        # ACCESSORY callback target: service.accessory OrderNotificationService impl (Req 8.2)
        accessoryS {
            sid = "accessoryS01"
            host = "127.0.0.1"
            port = 4120
        }
        jobrunrS {
            sid = "jobrunrS01"
            host = "127.0.0.1"
            port = 4107
        }
    }
}
