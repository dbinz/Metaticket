syntax = "proto3";

package metaticket.notification.mail.grpc;

message MailPluginTemplateProto {
  string order_status = 1;
  string mail_plugin = 2;
  string mail_template = 3;
}

message PaymentInfoProto {
  string payTime = 1;
  optional string payMethod = 2;
  string payStatus = 3;
  optional string paymentId = 4;
}

message OrderPriceProto {
  string name = 1;
  int64 price = 2;
  int32 quantity = 3;
  string priceCat = 4; // price category
  string sid = 5;
  int32 slots = 6;
}

message PromotionProto {
  string name = 1;
  int64 price = 2;
}

message OrderDetailProto {
  string eventName = 1;
  string eventTime = 2;
  string venue = 3;
  repeated OrderPriceProto prices = 4;
  repeated PromotionProto promotions = 5;
  int64 total = 6;
  optional string orderNote = 7;
}

message BuyerInfoProto {
  string name = 1;
  string phone = 2;
  string email = 3;
}

message RecipientInfoProto {
  string name = 1;
  string phone = 2;
  string address = 3;
}

message CustomFieldProto {
  string name = 1;
  optional string value = 2;
}

message OrderSummaryProto {
  string reservationId = 1;
  string orderId = 2;
  string orderCode = 3;
  string orderStatus = 4;
  string email = 5;
  optional bool paymentOffline = 6;
  optional string paymentNote = 7;
  optional PaymentInfoProto paymentInfo = 8;
  OrderDetailProto orderDetail = 9;
  BuyerInfoProto buyerInfo = 10;
  int64 createdAt = 11;
  optional RecipientInfoProto recipientInfo = 12;
  repeated CustomFieldProto customFields = 13;
}

message SendMailOrderRequest {
  string reqId = 1;
  string showId = 2;
  string sessionId = 3;
  optional string eventSquareImageUrl = 4;
  optional string eventNameImageUrl = 5;
  MailPluginTemplateProto mailPluginTemplate = 6;
  OrderSummaryProto orderSummary = 7;
  optional bool qrcode_email = 8;
}

message SendMailOTPRequest {
  string reqId = 1;
  optional string phone = 2;
  string email = 3;
  optional string name = 4;
  string otp = 5;
  string mailPlugin = 6;
  string mailTemplate = 7;
}

// NEW, dedicated accessory-order mail request. Additive only: the ticket
// SendMailOrderRequest and OrderSummaryProto messages above are unchanged.
message SendMailAccessoryOrderRequest {
  string req_id = 1;                        // set to Order_Code (traceable / de-dupable per order)
  string mail_plugin = 2;                   // "PluginMailTemplateAccessoryOrder"
  string mail_template = 3;                 // "accessory-order-confirm-vi"
  string recipient_email = 4;               // customer email recorded at checkout
  string order_code = 5;                    // e.g. "TF2026-0148"
  string show_name = 6;                     // accessory show name
  repeated AccessoryMailLineItem lines = 7; // per-line details
  int64  subtotal = 8;                      // whole VND, = Σ line_total
  bool   has_discount = 9;                  // whether a discount was applied
  string discount_code = 10;                // present iff has_discount
  int64  discount_amount = 11;              // whole VND, present iff has_discount
  int64  total = 12;                        // whole VND, = max(0, subtotal - discount)
  string pickup_note = 13;                  // Vietnamese pickup-at-show note
  string customer_name = 14;                // recipient name (email greeting)
  string customer_phone = 15;               // recipient phone recorded at checkout
}

message AccessoryMailLineItem {
  string product_name = 1;                  // product name
  string variant_label = 2;                 // empty/absent for single-SKU lines
  int32  quantity = 3;                      // integer line quantity
  int64  unit_price = 4;                    // whole VND
  int64  line_total = 5;                    // whole VND, = unit_price * quantity
}