# secretKey to encrypt/decrypt 16 bit
secretKey = "CHANGE_ME_16BYTE"

# database configuration
db {
    connection = "mongodb://localhost:47017"
    dbName = "metaticket"
    mailTemplateColName = "mailtemplate"
}

# ktor configuration
ktor {

    deployment {
        port = 4008
    }

    application {
        modules = [ metaticket.notification.ApplicationKt.module ]
    }
}

# mailer configuration
mailer {
    sender = "staging.info@metaticket.com.vn"
    supporter = "staging.support@metaticket.com.vn"
    hotline = "086 2461462"
    endPoint = "https://staging.metaticket.vn"
}

mailProcessor {
    maxProcessor = 5
}

zns {
    appId = "CHANGE_ME"
    secretKey = "CHANGE_ME"
    sendMessageUrl = "https://api-fns.fpt.work/api/send-message"
}

ticketQRCode {
    waitTimeToFullInS = 30
}

grpc {
    server {
        port = 4108
    }
    channel {
        qrcodeS {
            sid = "qrcodeS01"
            host = "127.0.0.1"
            port = 4110
        }
        ticketSlotS {
            sid = "ticketSlotS01"
            host = "127.0.0.1"
            port = 4109
        }
    }
}