# database configuration
db {
    connection = "mongodb://localhost:47017"
    dbName = "jobrunr"
}

dashboard {
    port: 44007
}

# ktor configuration
ktor {

    deployment {
        port = 4007
    }

    application {
        modules = [ metaticket.jobrunr.ApplicationKt.module ]
    }
}

grpc {
    server {
        port = 4107
    }
    channel {
        showS {
            sid = "showS01"
            host = "127.0.0.1"
            port = 4103
        }
        ticketS {
            sid = "ticketS01"
            host = "127.0.0.1"
            port = 4104
        }
        orderS {
            sid = "orderS01"
            host = "127.0.0.1"
            port = 4105
        }
        paymentS {
            sid = "paymentS01"
            host = "127.0.0.1"
            port = 4106
        }
        notificationS {
            sid = "notificationS01"
            host = "127.0.0.1"
            port = 4108
        }
        accessoryS {
            sid = "accessoryS01"
            host = "127.0.0.1"
            port = 4120
        }
    }
}

