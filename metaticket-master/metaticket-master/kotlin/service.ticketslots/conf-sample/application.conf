# secretKey to encrypt/decrypt 16 bit
secretKey = "CHANGE_ME_16BYTE"
qrcodeSecretKey = "CHANGE_ME_QR_16B"

# database configuration
db {
  connection = "mongodb://localhost:47017"
  dbName = "metaticket"
}

# ktor configuration
ktor {
  deployment {
    port = 4009
  }

  application {
    modules = [metaticket.ticketslots.ApplicationKt.module]
  }
}

grpc {
  server {
    port = 4109
  }

  channel {
      notificationS {
          sid = "notificationS01"
          host = "127.0.0.1"
          port = 4108
      }
      userS {
          sid = "customerUserS01"
          host = "127.0.0.1"
          port = 4150
      }
      showS {
          sid = "showS01"
          host = "127.0.0.1"
          port = 4103
      }
      orderS {
          sid = "orderS01"
          host = "127.0.0.1"
          port = 4105
      }
  }
}

# redis configuration
redis {
    cluster {
        nodes = ["10.0.1.12:43790", "10.0.1.12:43791", "10.0.1.12:43792"]
    }
}

zns {
    transferTicketSlot {
        plugin = "PluginZNSBasic"
        templateId = "11039"
        expiredTimeInS = 300
        failover = true
        maxOtpAttempts = 3
    }
    notifyTicketSlot {
        plugin = "PluginZNSBasic"
        templateId = "9470"
        failover = true
        maxOtpAttempts = 3
    }
}

captcha {
    hcaptcha {
        url = "https://api.hcaptcha.com/siteverify"
        secretKey = "CHANGE_ME"
        siteKey = "43b65b74-d482-4dc0-9766-9df601526856"
    }
    recaptcha {
        url = "https://www.google.com/recaptcha/api/siteverify"
        secretKey = "CHANGE_ME"
        siteKey = "6LeCWmgrAAAAAN8l0iZeJwZ3hhvdig8M-0LKjpjZ"
    }
    captchaGateway = hcaptcha
    enable = true
}

kafka {
  bootstrapServers = "10.0.1.12:49092,10.0.1.12:49093,10.0.1.12:49094"
  groupIdOrderSucceed = "ticket-slot-service"
  groupIdGenerateTicketSlotQRCode = "ticket-slot-service"
  topicOrderSucceed = "order.succeed.topic"
  topicGenerateTicketSlotQRCode = "generate.ticket.slot.qrcode.topic"
}
