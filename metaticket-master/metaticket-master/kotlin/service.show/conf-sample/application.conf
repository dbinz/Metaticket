# database configuration
db {
  connection : "mongodb://localhost:47017"
  dbName : "metaticket"
  showColName: "show"
  cityColName: "city"
  eventCategoryColName: "event-category"
}

ktor {
  deployment {
    port = 4003
  }
  application {
    modules = [ metaticket.show.ApplicationKt.module ]
  }
}

homepage {
    base_url: "https://staging.metaticket.vn"
}

metasearch {
    baseUrl: "http://10.0.1.12:48080/internal/metasearch/"
    createUpdateShowUrl: "shows/create-or-update"
    updateSoldTicketUrl: "shows/update-sold-ticket"
    xApiKey: "CHANGE_ME"
}

cloudflare {
    baseUrl: "https://api.cloudflare.com/client/v4/zones/"
    bearerToken: "CHANGE_ME"
    zoneId: "CHANGE_ME"
    fileBaseUrl: "https://staging.metaticket.vn/"
    tags: [ "show-api" ]
}

storage_path {
    image_path_temp: "./show-image-temp"
    image_path: "./show-image"
    image_prefix: "https://staging.metaticket.vn/"
}

grpc {
    server {
        port = 4103
    }
    channel {
        ticketS {
            sid = "ticketS01"
            host = "127.0.0.1"
            port = 4104
        }
        jobrunrS {
            sid = "jobrunrS01"
            host = "127.0.0.1"
            port = 4107
        }
    }
}