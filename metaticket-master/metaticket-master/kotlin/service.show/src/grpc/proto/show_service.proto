syntax = "proto3";

package metaticket.show.grpc;

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";
import "show_message.proto";

service ShowService {
  rpc GetShowById(GetShowByIdRequest) returns (GetShowResponse);
  rpc GetSessionById(GetSessionByIdRequest) returns (GetSessionResponse);
  rpc CreateSession(CreateSessionRequest) returns (google.protobuf.StringValue);

  rpc GetCity(GetCityRequest) returns (CityProto);

  rpc GenerateUniqueId(GenerateUniqueIdRequest) returns (google.protobuf.StringValue);

  rpc UpdateSoldTicket(UpdateSoldTicketRequest) returns (google.protobuf.Empty);

  rpc DeleteTempImages(DeleteTempImagesRequest) returns (DeleteTempImagesResponse);
}