# secretKey to encrypt/decrypt 16 bit
secretKey = "CHANGE_ME_16BYTE"

# database configuration
db {
    connection = "mongodb://localhost:47017"
    dbName = "metaticket"
    orderDataCollectorMappingColName = "order-data-collector-mapping"
    orderDataCollectorColName = "order-data-collector"
    orderDataCollectedColName = "order-data-collected"
}

odc {
    linkBaseUrl = "https://staging.metaticket.vn/odcapp"
}

ktor {
    deployment {
        port = 3032
    }
    application {
        modules = [ metaticket.order.datacollector.ApplicationKt.module ]
    }
}

grpc {
    server {
        port = 3132
    }
    channel {
        ticketS {
            sid = "ticketS01"
            host = "127.0.0.1"
            port = 3104
        }
    }
}
