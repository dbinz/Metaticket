ktor {
    development = false
    deployment {
        port = 4050
    }
    application {
        modules = [ metaticket.customer.user.ApplicationKt.module ]
    }
}

mongodb {
    url = "mongodb://localhost:47017"
    database = "metaticket"
}

# redis configuration
redis {
    cluster {
        nodes = ["10.0.1.12:43790", "10.0.1.12:43791", "10.0.1.12:43792"]
    }
}

bcrypt {
    salt = "CHANGE_ME"
}

captcha {
    hcaptcha {
        url = "https://api.hcaptcha.com/siteverify"
        secretKey = "CHANGE_ME"
        siteKey = "43b65b74-d482-4dc0-9766-9df601526856"
    }
    recaptcha {
        url = "https://www.google.com/recaptcha/api/siteverify"
        secretKey = "CHANGE_ME"
        siteKey = "6LeCWmgrAAAAAN8l0iZeJwZ3hhvdig8M-0LKjpjZ"
    }
    captchaGateway = hcaptcha
    enable = false
}

session {
    expiredTimeInS = 300
    maxOtpAttempts = 3
}

emailVerification {
    enable = true
}

zns {
    registerUser {
        plugin = "PluginZNSBasic"
        templateId = "8226"
        failover = true
    }

    resetPassword {
        plugin = "PluginZNSBasic"
        templateId = "8225"
        failover = true
    }
}

mail {
    validateMail {
        plugin = "PluginMailTemplateOTP"
        templateId = "mailtemplate.send-otp"
    }
}

grpc {
    server {
        port = 4150
    }
    channel {
        notificationS {
            sid = "notificationS01"
            host = "127.0.0.1"
            port = 4108
        }
    }
}