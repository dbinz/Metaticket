# service.accessory configuration (sample)
ktor {
  deployment {
    port = 4020
  }
  application {
    modules = [ metaticket.accessory.ApplicationKt.module ]
  }
}

# MongoDB (isolated accessory database)
mongodb {
  connectionString = "mongodb://localhost:47017"
  dbName = "metaticket"
}

# gRPC: hosts the accessory-side OrderNotificationService impl and dials payment/notification.
grpc {
  server {
    port = 4120
  }
  channel {
    payment {
      host = "127.0.0.1"
      port = 4106
    }
    notification {
      host = "127.0.0.1"
      port = 4108
    }
    # service.jobrunr — durable confirmation-email fallback scheduling (ResendMailAccessoryOrder).
    jobrunr {
      host = "127.0.0.1"
      port = 4107
    }
  }
}

# JobRunr fallback tuning. retry = -1 means retry forever (matches service.order's sendEmail).
jrunr {
  sendEmail {
    retry = -1
  }
}

# Checksum encode/decode of public identifiers. AES-128 => MUST be exactly 16 bytes.
# MUST match service.payment secretKey (same env) for payment-id Checksum interop.
secretKey = "CHANGE_ME_16BYTE"

accessory {
  orderTtlMinutes = 5
  # how often the in-process background loop scans for pre-terminal orders past their TTL (Req 11.2)
  expirySweepIntervalSeconds = 300
  # orderTtlMinutes only covers the "choose payment method" step. Once the customer is sent to the
  # gateway (PaymentProcessing) the order settles by the gateway outcome (IPN / inquiry). This is only a
  # safety net for a gateway that never reports; keep it well above gateway session + inquiry window
  # (service.payment maxTimeQueryForNotfoundInM). 0 disables. Default 60 when absent.
  paymentProcessingStaleMinutes = 60
  # How often to CAS-open Waiting shows whose saleOpenAt is already due (missed JobRunr jobs).
  saleOpenSweepIntervalSeconds = 15
  # Staging/prod: true so JobRunr callbacks this process. Local hybrid pointing at remote JobRunr: false.
  scheduleOpenShowOnJobrunr = true
  rateLimit {
    limit = 20
    windowSeconds = 60
  }
  # Checkout payload bounds (Req 6.1, 6.14, 16.3). maxLineQuantity should align with the frontend
  # cart cap. Absent/malformed keys fall back to the built-in defaults (1..50 lines, 1..99 qty).
  checkout {
    minLines = 1
    maxLines = 5
    minLineQuantity = 1
    maxLineQuantity = 99
  }
}
