# secretKey to encrypt/decrypt 16 bit
secretKey = "CHANGE_ME_16BYTE"

# database configuration
db {
    connection = "mongodb://localhost:47017"
    dbName = "metaticket"
    colTicketDoc = "ticket-doc"
    colTicketCapacity = "ticket-capacity"
    colTicketReservation = "ticket-reservation"
    colConfigPerReservation = "config-per-reservation"
    categoryMappingColName = "category-mapping"
}

# redis configuration
redis {
    cluster {
        nodes = ["10.0.1.12:43790", "10.0.1.12:43791", "10.0.1.12:43792"]
    }
}

# ticket reservation processor
ticket {
    reservation {
        processor {
            total = 10
        }
    }
}

jrunr {
    expireReservation {
        delayInSecond = 300
        retry = -1 # retry forever
    }
}

# ktor configuration
ktor {
    deployment {
        port = 4004
    }

    application {
        modules = [ metaticket.ticket.ApplicationKt.module ]
    }
}

grpc {
    server {
        port = 4104
    }
    channel {
        showS {
            sid = "showS01"
            host = "127.0.0.1"
            port = 4103
        }
        jobrunrS {
            sid = "jobrunrS01"
            host = "127.0.0.1"
            port = 4107
        }
    }
}
