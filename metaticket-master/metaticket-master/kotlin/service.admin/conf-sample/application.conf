# secretKey to encrypt/decrypt 16 bit
secretKey = "CHANGE_ME_16BYTE"

# database configuration
db {
  connection = "mongodb://localhost:47017"
  dbName = "metaticket"
  showSessionDraftColName = "show-session-draft"
  showSessionDraftPromotionColName = "show-session-draft-promotion"
  showSessionDraftOrderCustomFieldColName = "show-session-draft-order-custom-field"
  reportFilterColName = "report-filter"
  ticketBookingColName = "ticket_booking"
}

ticketBooking {
    defaultCustomerUserId = "6855a90cdf8b832abb284fb3"
}

reportGov {
  username: "CHANGE_ME"
  password: "CHANGE_ME"
  filePath: "./conf/report.gov.json"
}

ktor {
  deployment {
    port = 4040
  }
  application {
    modules = [ metaticket.admin.ApplicationKt.module ]
  }
}

grpc {
    server {
        port = 4140
    }
    channel {
        showS {
            sid = "showS01"
            host = "127.0.0.1"
            port = 4103
        }
        ticketS {
            sid = "ticketS01"
            host = "127.0.0.1"
            port = 4104
        }
        orderS {
            sid = "orderS01"
            host = "127.0.0.1"
            port = 4105
        }
        paymentS {
            sid = "paymentS01"
            host = "127.0.0.1"
            port = 4106
        }
        notificationS {
            sid = "notificationS01"
            host = "127.0.0.1"
            port = 4108
        }
        userS {
            sid = "customerUserS01"
            host = "127.0.0.1"
            port = 4150
        }
    }
}