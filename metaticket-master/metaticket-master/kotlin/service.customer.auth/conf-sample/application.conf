# ktor configuration
ktor {
    development = false
    deployment {
        port = 4051
    }
    application {
        modules = [ metaticket.customer.auth.ApplicationKt.module ]
    }
}

jwt {
    secret = "CHANGE_ME"
    issuer = "https://staging.metaticket.vn"
    audience = "https://staging.metaticket.vn"
    realm = "Access to 'authentication'"
    tokenExpirationInM = 20 # minute
    refreshTokenExpirationInH = 24 # hour
}

# redis configuration
redis {
    cluster {
        nodes = ["10.0.1.12:43790", "10.0.1.12:43791", "10.0.1.12:43792"]
    }
}

captcha {
    hcaptcha {
        url = "https://api.hcaptcha.com/siteverify"
        secretKey = "CHANGE_ME"
        siteKey = "43b65b74-d482-4dc0-9766-9df601526856"
    }
    recaptcha {
        url = "https://www.google.com/recaptcha/api/siteverify"
        secretKey = "CHANGE_ME"
        siteKey = "6LeCWmgrAAAAAN8l0iZeJwZ3hhvdig8M-0LKjpjZ"
    }
    captchaGateway = hcaptcha
    enable = false
}

vote {
    adminSecret = "CHANGE_ME_LOCAL_ONLY"
    # Node Redis riêng cho vote (KHÔNG dùng chung redis.cluster.nodes phía trên) — xem comment
    # trong VoteRepository.kt lý do dùng đúng 1 node cố định thay vì danh sách nhiều node.
    redisNode = "10.0.1.12:43790"
}

grpc {
    channel {
        userS {
            sid = "customerUserS01"
            host = "127.0.0.1"
            port = 4150
        }
    }
}