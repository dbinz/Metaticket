# secretKey to encrypt/decrypt 16 bit
secretKey = "CHANGE_ME_16BYTE"

# database configuration
db {
    connection = "mongodb://localhost:47017"
    dbName = "metaticket"
    orderColName = "order"
    promotionColName = "order-promotion-plugin-config"
    promotionCodeQuantityColName = "order-promotion-code-quantity"
    promotionComboQuantityColName = "order-promotion-combo-quantity"
    customFieldColName = "order-custom-field"
    customFieldMappingColName = "order-custom-field-mapping"
    failedOrderSucceedEventColName = "failed-order-succeed-event"
}

jrunr {
    notifyTicket {
        orderStatusChanged {
            retry = -1
        }
    }
    sendEmail {
        retry = -1
    }
}

ktor {
    deployment {
        port = 4005
    }
    application {
        modules = [ metaticket.order.ApplicationKt.module ]
    }
}

kafka {
    bootstrapServers = "10.0.1.12:49092,10.0.1.12:49093,10.0.1.12:49094"
    topicOrderSucceed = "order.succeed.topic"

    # Retry configuration for order succeed events
    orderSucceedRetry {
        maxRetryCount = 10
        baseDelaySeconds = 30
        maxDelaySeconds = 3600
        retryJobIntervalMinutes = 5
        cleanupOldEventsAfterDays = 7
    }
}

grpc {
    server {
        port = 4105
    }
    channel {
        showS {
            sid = "showS01"
            host = "127.0.0.1"
            port = 4103
        }
        ticketS {
            sid = "ticketS01"
            host = "127.0.0.1"
            port = 4104
        }
        paymentS {
            sid = "paymentS01"
            host = "127.0.0.1"
            port = 4106
        }
        jobrunrS {
            sid = "jobrunrS01"
            host = "127.0.0.1"
            port = 4107
        }
        notificationS {
            sid = "notificationS01"
            host = "127.0.0.1"
            port = 4108
        }
        orderDataCollectorS {
            sid = "orderDataCollectorS01"
            host = "127.0.0.1"
            port = 4132
        }
    }
}
