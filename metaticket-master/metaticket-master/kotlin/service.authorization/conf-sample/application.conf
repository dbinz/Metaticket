# database configuration
db {
  connection = "mongodb://localhost:47017"
  dbName = "metaticket"
  policyCol = "rbac-policy"
}

casbin {
  defaultUserRole = "user-role-default"
}

ktor {
  deployment {
    port = 4031
  }
  application {
    modules = [ metaticket.authorization.ApplicationKt.module ]
  }
}
