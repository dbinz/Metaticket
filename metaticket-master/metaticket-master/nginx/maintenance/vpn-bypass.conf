# Server-local list of WireGuard client CIDRs allowed through the maintenance gate, one per line:
#     10.x.y.0/24 1;
# Kept empty in the repo (no internal addresses committed): an empty list means nobody bypasses.
# Do not overwrite the server copy when syncing this directory, and never delete it: nginx refuses to
# start without it.
#
# This file is pasted into a `geo` block, so any geo directive here changes the gate. ONLY `<CIDR> 1;` lines:
#   - no `proxy ...;`   -> lets a forged X-Forwarded-For carry a VPN address through the gate;
#   - no `default 1;`, `0.0.0.0/0`, `::/0`, or Cloudflare/load-balancer/shared-NAT ranges -> opens the gate to everyone.
# After every edit: `sudo nginx -t && sudo systemctl reload nginx`, then from a machine OFF the VPN check that
# /maintenance/status reports true and / returns 503 while maintenance is on.
