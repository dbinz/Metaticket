# Include once in http context, before the customer server block.
map $uri $maintenance_exempt {
    # error_page redirects must re-evaluate the internal HTML exception.
    volatile;
    default 0;
    ~^/maintenance/status$ 1;
    ~^/maintenance/payment-return[.]js$ 1;
    ~^/__metaticket_maintenance[.]html$ 1;
    ~^/api/payment/(ipn/result|return/result)(/|$) 1;
    ~^/\.well-known/acme-challenge/ 1;
    # Static images and MFE modules carry no API calls, so they stay reachable while the storefront is closed.
    ~^/(show-image|show-image-temp|seatplanner-image|assets|modules)(/|$) 1;
}

map $uri $maintenance_is_api {
    default 0;
    ~^/(api|private)(/|$) 1;
}

# Operators on the WireGuard VPN bypass the gate to smoke-test before reopening. Keyed on the TCP peer
# ($realip_remote_addr) so a forged X-Forwarded-For cannot pass even if the server enables real_ip,
# provided vpn-bypass.conf holds only `<CIDR> 1;` lines (see the rules in that file).
geo $realip_remote_addr $maintenance_bypass {
    default 0;
    include /etc/nginx/metaticket-maintenance/vpn-bypass.conf;
}
