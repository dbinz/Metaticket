# Include only on the customer domain. Do not change payment location ACLs.
open_file_cache off;
set $maintenance_enabled false;
if (-f /var/lib/metaticket/maintenance/enabled) {
    set $maintenance_enabled true;
}
# VPN operators see the real site, status included, so their open tabs do not show the overlay either.
if ($maintenance_bypass) {
    set $maintenance_enabled false;
}

set $maintenance_gate "$maintenance_enabled:$maintenance_exempt:$maintenance_is_api";
# Separate internal codes preserve genuine upstream 503 errors and JSON API responses.
if ($maintenance_gate = "true:0:1") {
    return 598;
}
if ($maintenance_gate = "true:0:0") {
    return 597;
}

error_page 597 =503 /__metaticket_maintenance.html;
error_page 598 =503 @metaticket_maintenance_api;

location = /maintenance/status {
    # Every open storefront tab polls this; logging it would add millions of lines a day.
    access_log off;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 200 '{"maintenance":$maintenance_enabled}';
}

location = /maintenance/payment-return.js {
    alias /etc/nginx/metaticket-maintenance/payment-return.js;
    default_type application/javascript;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /__metaticket_maintenance.html {
    internal;
    alias /etc/nginx/metaticket-maintenance/maintenance.html;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "60" always;
    add_header X-Maintenance-Mode "on" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;
}

location @metaticket_maintenance_api {
    default_type application/json;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "60" always;
    add_header X-Maintenance-Mode "on" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 503 '{"code":"MAINTENANCE","message":"Hệ thống đang bảo trì, vui lòng thử lại sau."}';
}
