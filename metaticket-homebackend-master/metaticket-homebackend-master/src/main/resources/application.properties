#The spring.profiles.active is a property in Spring Boot that is used to specify which Spring profile to use.
# Profiles in Spring Boot allow for the providing of application configuration in different environments.
# You might have sets of properties that are common to all profiles, and some that are specific to the development, testing, or production environments.
spring.profiles.active=staging

# --- Resource guards (apply to all profiles) ---
# Bound concurrent request threads so simultaneous heavy responses can't blow the heap under load.
server.tomcat.threads.max=50
server.tomcat.accept-count=100
# Reject oversized request bodies early (defense-in-depth alongside Nginx client_max_body_size).
server.tomcat.max-swallow-size=10MB
server.tomcat.max-http-form-post-size=10MB
# Don't let a stuck async request hold a worker forever.
spring.mvc.async.request-timeout=30s
