server {
    listen 80;
    server_name localhost;

    # ---- /news/:slug.html → service.news BFF render ----
    location ~ ^/news/(?!category/)([^/]+)\.html/?$ {
        set $article_slug $1;
        proxy_pass http://127.0.0.1:4041/public/news/render/$article_slug;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_cache_valid 200 5m;
        proxy_cache_use_stale error timeout updating;
        add_header X-Render-By "service.news" always;
    }

    # Bare /news/:slug → canonical .html URL
    location ~ ^/news/(?!category/)([^/.]+)/?$ {
        return 301 $scheme://$host/news/$1.html;
    }

    # Trang tĩnh ngoài Angular (src/app/pages/refund-ticket). Khớp chính xác để không bị 301 thêm "/" cuối:
    # redirect đó là URL tuyệt đối http://<host>/ của container, sai scheme khi đứng sau proxy TLS.
    location = /refund-ticket {
        root /usr/share/nginx/html/mt-ticket/browser;
        try_files /refund-ticket/index.html =404;
    }

    # ---- CSR + static assets (js/css/img) ----
    location / {
        root /usr/share/nginx/html/mt-ticket/browser;
        index index.html;
        try_files $uri $uri/ /index.html =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
