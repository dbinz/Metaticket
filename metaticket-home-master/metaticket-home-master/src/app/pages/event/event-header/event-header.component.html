<app-navbar />

    <p class="text-white text-[35px] md:text-[48px] font-medium">{{ name }}</p>
  </div>

  <div class="absolute bottom-[-20px] lg:bottom-[-80px] z-1">
    <app-image [sx]="'lg:h-[165px] h-[75px]'" [src]="appIcons.icRubik" />

</div>
