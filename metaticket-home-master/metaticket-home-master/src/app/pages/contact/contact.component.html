<app-layout [isDarkMode]="false">
  <div class="w-full flex flex-col">
    <app-navbar/>
    <div class="w-full px-5 pt-10 pb-20 bg-white flex flex-col items-center">
      <p nz-typography class="text-2xl leading-120pct text-black font-medium">Liên hệ</p>
      <div class="lg:w-1/2 w-full">
        <div class="w-full flex flex-col space-y-6 mt-6 mb-8">
          <div class="flex flex-col lg:flex-row gap-6">
            <app-form-input
              class="flex-1"
              [label]="'Email'"
              [placeholder]="'VD: Nguyễn Văn A'"
              [formControl]="formGroup.controls.email"
              [fontSize]="'sm'"
            />
            <app-form-input
              class="flex-1"
              [label]="'Số điện thoại'"
              [placeholder]="'VD: 012345678'"
              [formControl]="formGroup.controls.phone"
              [fontSize]="'sm'"
            />
          </div>
          <app-form-input
            [label]="'Loại câu hỏi'"
            [placeholder]="'VD: abcdef@gmail.com'"
            [formControl]="formGroup.controls.type"
            [fontSize]="'sm'"
          />
          <app-form-input
            [label]="'Tiêu đề'"
            [placeholder]="'VD: abcdef@gmail.com'"
            [formControl]="formGroup.controls.title"
            [fontSize]="'sm'"
          />
          <div class="no-tailwindcss-base">
            <ckeditor [editor]="editor" data=""></ckeditor>
          </div>
          <button class="flex relative cursor-pointer items-center gap-2">
            <app-image class="w-[16px] h-[16px]" [src]="appIcons.icAttach"></app-image>
            <input type="file" class="absolute inset-0 opacity-0 cursor-pointer hover:file:cursor-pointer" multiple/>
            <p class="text-16-24 font-medium text-blue-4867FC border-b-[1px] border-blue-4867FC">Tệp đính kèm</p>
          </button>
          <app-button
            class="w-full"
            [title]="'Submit'"
            [fontSize]="'lg'"
          />
        </div>

      </div>
    </div>
  </div>
</app-layout>
