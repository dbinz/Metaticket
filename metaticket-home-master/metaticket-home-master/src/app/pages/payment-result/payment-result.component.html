<div class="min-h-screen flex items-center justify-center bg-gray-50 p-4 font-sans">
  <div class="bg-white p-8 rounded-xl shadow-lg text-center w-full max-w-md">
    <!-- Sử dụng ngSwitch để quản lý các trạng thái một cách rõ ràng -->
    <div [ngSwitch]="status" class="flex flex-col items-center">
      <!-- Trạng thái Thành công -->
      <div *ngSwitchCase="'success'">
        <!-- Icon Success (Heroicons) -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="w-20 h-20 text-green-500 mb-4"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        </svg>
        <h2 class="text-2xl font-bold text-gray-800">{{ message }}</h2>
      </div>

      <!-- Trạng thái Thất bại -->
      <div *ngSwitchCase="'failed'">
        <!-- Icon Failed (Heroicons) -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="w-20 h-20 text-red-500 mb-4"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        </svg>
        <h2 class="text-2xl font-bold text-gray-800">{{ message }}</h2>
      </div>

      <!-- Trạng thái Lỗi -->
      <div *ngSwitchCase="'error'">
        <!-- Icon Error (Heroicons) -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="w-20 h-20 text-red-600 mb-4"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"
          />
        </svg>
        <h2 class="text-2xl font-bold text-gray-800">{{ message }}</h2>
      </div>

      <!-- Trạng thái Đang xử lý (Mặc định) -->
      <div *ngSwitchDefault>
        <!-- Icon Spinner -->
        <svg
          class="animate-spin h-20 w-20 text-blue-600 mb-4"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
        >
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
          ></path>
        </svg>
        <h2 class="text-2xl font-bold text-gray-800">{{ message }}</h2>
      </div>
    </div>

    <!-- Vùng hiển thị thông báo chung -->
    <p class="mt-5 text-base text-gray-600">{{ message }}</p>

    <!-- Vùng đếm ngược và nút đóng -->
    <div class="mt-8 space-y-4">
      <p class="text-sm text-gray-500">
        Cửa sổ này sẽ tự động đóng sau <span class="font-bold text-gray-700">{{ countdown }}</span> giây.
      </p>
      <button
        (click)="closeTabNow()"
        class="w-full px-4 py-2 bg-gray-600 text-white font-semibold rounded-lg shadow-md hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-opacity-75 transition ease-in-out duration-150"
      >
        Đóng ngay
      </button>
    </div>
  </div>
</div>
