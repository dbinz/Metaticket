<div class="flex flex-col relative gap-4 justify-center items-center bg-blue-163AEA h-screen px-6 md:px-96 overflow-hidden">
  <div class="absolute top-6">
    <app-image
      [sx]="'w-[140px] md:w-[225px] cursor-pointer'"
      [src]="appIcons.icLogoDarkMode"
      (click)="navigateToHome()"
    />
  </div>
  <app-image
    [sx]="'absolute top-[60px] left-0 w-[80px] lg:w-[100px] laptop:w-[200px]'"
    [src]="appIcons.icDoughnutLeft">
  </app-image>
  <div class="absolute top-[100px] md:top-[-100px] right-0 -z-0">
    <app-image sx="h-full md:h-[2100px] w-full" [src]="appIcons.icGrid"></app-image>
  </div>
  <app-image
    [sx]="'absolute bottom-[-60px] right-[-30px] w-[132px] laptop:w-[200px]'"
    [src]="appIcons.icHeadphone">
  </app-image>
  <div class="absolute left-0 lg:left-[160px] bottom-[40px] lg:bottom-[-10px] z-1 lg:-rotate-90">
    <app-image [sx]="'lg:h-[165px] h-[75px]'" [src]="appIcons.icRubik"/>
  </div>
  <div class="absolute right-[40px] lg:right-[160px] top-[140px] lg:top-[140px] z-1">
    <app-image [sx]="'lg:h-[68px] h-[48px]'" [src]="appIcons.icStar"/>
  </div>
  <div class="flex justify-center flex-col items-center gap-4">
    <p class="font-medium text-white text-64-64">404</p>
    <p class="text-white text-18-28 md:text-24-28 text-center">
      Xin lỗi, trang bạn đang tìm kiếm không tồn tại! Vui lòng quay trở lại Trang tìm kiếm trước đó hoặc về Trang chủ
    </p>
    <div class="flex gap-2">
      <app-button
        [color]="'transparent'"
        [title]="'Quay lại'"
        (handlerOnPressed)="goBack()"
      />
      <app-button
        [title]="'Trang chủ'"
        [color]="'white'"
        (handlerOnPressed)="navigateToHome()"
      />
    </div>
  </div>
</div>
