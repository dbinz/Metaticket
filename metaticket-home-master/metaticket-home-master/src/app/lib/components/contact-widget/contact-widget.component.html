<!-- Contact widget fixed at bottom-right across all pages -->
<div class="contact-widget" role="region" aria-label="Contact widget">
  <!-- Expanded panel -->
  <div
    #panelRef
    id="contact-panel"
    class="contact-widget__panel"
    [class.is-open]="open"
    [attr.aria-hidden]="!open"
  >
    <div class="contact-widget__panel-header">
      <div class="contact-widget__panel-header-bg-1" aria-hidden="true"></div>
      <div class="contact-widget__panel-header-bg-2" aria-hidden="true"></div>
      <div class="contact-widget__panel-header-content">
        <div class="contact-widget__title">Liên hệ với chúng tôi</div>
      </div>
    </div>

    <div class="contact-widget__items">
      <ng-container *ngFor="let c of contacts">
        <button
          type="button"
          class="contact-widget__item"
          [class.is-hovered]="hoveredId === c.id"
          [ngStyle]="{ background: hoveredId === c.id ? c.bg + '12' : 'transparent' }"
          (mouseenter)="hoveredId = c.id"
          (mouseleave)="hoveredId = null"
          (click)="onContactClick(c)"
          [attr.aria-label]="c.label + ': ' + c.sublabel"
        >
          <span
            class="contact-widget__item-icon"
            [ngStyle]="{
              background: hoveredId === c.id ? c.hoverBg : c.bg,
              boxShadow:
                hoveredId === c.id
                  ? '0 6px 16px ' + c.bg + '50'
                  : '0 2px 8px ' + c.bg + '30'
            }"
          >
            <ng-container [ngSwitch]="c.id">
              <svg
                *ngSwitchCase="'facebook'"
                width="30"
                height="30"
                viewBox="0 0 24 24"
                fill="currentColor"
                aria-hidden="true"
              >
                <path
                  d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"
                />
              </svg>

              <svg
                *ngSwitchCase="'zalo'"
                width="35"
                height="35"
                viewBox="0 0 48 48"
                fill="none"
                aria-hidden="true"
              >
                <path fill="#2962ff" d="M15,36V6.827l-1.211-0.811C8.64,8.083,5,13.112,5,19v10c0,7.732,6.268,14,14,14h10	c4.722,0,8.883-2.348,11.417-5.931V36H15z"/><path fill="#eee" d="M29,5H19c-1.845,0-3.601,0.366-5.214,1.014C10.453,9.25,8,14.528,8,19	c0,6.771,0.936,10.735,3.712,14.607c0.216,0.301,0.357,0.653,0.376,1.022c0.043,0.835-0.129,2.365-1.634,3.742	c-0.162,0.148-0.059,0.419,0.16,0.428c0.942,0.041,2.843-0.014,4.797-0.877c0.557-0.246,1.191-0.203,1.729,0.083	C20.453,39.764,24.333,40,28,40c4.676,0,9.339-1.04,12.417-2.916C42.038,34.799,43,32.014,43,29V19C43,11.268,36.732,5,29,5z"/><path fill="#2962ff" d="M36.75,27C34.683,27,33,25.317,33,23.25s1.683-3.75,3.75-3.75s3.75,1.683,3.75,3.75	S38.817,27,36.75,27z M36.75,21c-1.24,0-2.25,1.01-2.25,2.25s1.01,2.25,2.25,2.25S39,24.49,39,23.25S37.99,21,36.75,21z"/><path fill="#2962ff" d="M31.5,27h-1c-0.276,0-0.5-0.224-0.5-0.5V18h1.5V27z"/><path fill="#2962ff" d="M27,19.75v0.519c-0.629-0.476-1.403-0.769-2.25-0.769c-2.067,0-3.75,1.683-3.75,3.75	S22.683,27,24.75,27c0.847,0,1.621-0.293,2.25-0.769V26.5c0,0.276,0.224,0.5,0.5,0.5h1v-7.25H27z M24.75,25.5	c-1.24,0-2.25-1.01-2.25-2.25S23.51,21,24.75,21S27,22.01,27,23.25S25.99,25.5,24.75,25.5z"/><path fill="#2962ff" d="M21.25,18h-8v1.5h5.321L13,26h0.026c-0.163,0.211-0.276,0.463-0.276,0.75V27h7.5	c0.276,0,0.5-0.224,0.5-0.5v-1h-5.321L21,19h-0.026c0.163-0.211,0.276-0.463,0.276-0.75V18z"/>
              </svg>

              <svg
                *ngSwitchCase="'hotline'"
                width="25"
                height="25"
                viewBox="0 0 24 24"
                fill="currentColor"
                aria-hidden="true"
              >
                <path
                  d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"
                />
              </svg>

              <svg
                *ngSwitchCase="'email'"
                width="25"
                height="25"
                viewBox="0 0 24 24"
                fill="currentColor"
                aria-hidden="true"
              >
                <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" />
              </svg>
            </ng-container>
          </span>

          <span class="contact-widget__item-text">
            <span class="contact-widget__label">{{ c.label }}</span>
            <span class="contact-widget__sublabel">{{ c.sublabel }}</span>
          </span>

          <span
            class="contact-widget__item-arrow"
            [ngStyle]="{ color: c.bg }"
            [class.is-hovered]="hoveredId === c.id"
            aria-hidden="true"
          >
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
              <path
                d="M6 3l5 5-5 5"
                stroke="currentColor"
                stroke-width="1.8"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        </button>
      </ng-container>
    </div>
  </div>

  <!-- Trigger button -->
  <button
    #buttonRef
    type="button"
    class="contact-widget__trigger"
    (click)="toggleOpen()"
    [attr.aria-expanded]="open"
    aria-controls="contact-panel"
    aria-label="Mở menu liên hệ"
    [class.is-open]="open"
  >
    <!-- Pulse ring -->
    <span *ngIf="pulse && !open" class="contact-widget__pulse-ring" aria-hidden="true"></span>

    <!-- Icon: chat bubble ↔ X -->
    <span class="contact-widget__trigger-icon" aria-hidden="true">

        </g>        
        </g>        
        <g id="_x31_9_video_call"/>        
        <g id="_x31_8_letter_box"/>        
        <g id="_x31_7_papperplane"/>        
        <g id="_x31_6_laptop"/>        
        <g id="_x31_5_connection"/>        
        <g id="_x31_4_phonebook"/>        
        <g id="_x31_3_classic_telephone"/>

        <g id="_x31_1_man_talking"/>

        <g id="_x30_7_information"/>        
        <g id="_x30_6_phone_talking"/>        
        <g id="_x30_5_women_talking"/>        
        <g id="_x30_4_calling"/>        
        <g id="_x30_3_women"/>        
        <g id="_x30_2_writing"/>        
        <g id="_x30_1_chatting"/>        
        </svg>
    </span>

    <ng-container *ngIf="!open">
      <span class="contact-widget__trigger-text hidden tablet:block">Liên hệ</span>
    </ng-container>
  </button>
</div>
