<div class="w-full flex flex-col items-start gap-y-1">
  <p nz-typography class="text-sm text-black leading-6 font-medium break-words">
    {{ label }}{{ isRequired ? '' : '' }}
  </p>
  <div class="w-full rounded-full px-4 py-2 border border-gray-C9C9C9 flex flex-row items-center gap-x-2">
    <app-image [src]="isValid ? appIcons.icSuccess : appIcons.icWarning" [sx]="'w-4 h-4'"/>
    <button
      class="flex-1 w-px overflow-hidden whitespace-nowrap block text-ellipsis text-sm text-black leading-6 font-medium"
      (click)="onOpenOdcLink()"
    >
      {{ odcLink }}
    </button>
    <button
      class="text-sm text-black leading-6 font-bold"
      (click)="onCopyClipboard()"
    >
      Copy
    </button>
  </div>
</div>
