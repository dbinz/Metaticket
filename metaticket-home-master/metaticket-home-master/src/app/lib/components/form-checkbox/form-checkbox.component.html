<ng-template [ngIf]="fontSize === 'base'">
  <nz-form-item class="w-full flex flex-col m-0 items-start">
    <input type="checkbox" class="w-5 h-5 flex-shrink-0 mt-0.5" [formControl]="formControl">
    <nz-form-label [nzLabelWrap]="true" class="p-0 mb-2 *:min-h-6 *:h-auto *:text-base *:font-medium *:whitespace-normal *:break-words whitespace-normal text-left" [ngClass]="{'text-stroke-2': !formControl.invalid, 'text-red-D94D27': formControl.invalid}">
      {{ label }}<span *ngIf="isRequired" class="text-red-D94D27 ml-1">*</span>
    </nz-form-label>
  </nz-form-item>
</ng-template>

<ng-template [ngIf]="fontSize === 'sm'">
  <nz-form-item class="w-full flex flex-row mt-7 items-start gap-x-2">
    <input type="checkbox" class="w-5 h-5 flex-shrink-0 mt-0.5" [formControl]="formControl">
    <nz-form-label [nzLabelWrap]="true" class="flex-1 min-w-0 p-0 mb-1 *:min-h-6 *:h-auto *:text-sm *:leading-6 *:font-medium *:whitespace-normal *:break-words whitespace-normal [&>*:first-child]:after:content-[''] text-left" [ngClass]="{'text-stroke-2': !formControl.invalid, 'text-red-D94D27': formControl.invalid}">
      {{ label }}<span *ngIf="isRequired" class="text-red-D94D27 ml-1">*</span>
    </nz-form-label>
  </nz-form-item>
</ng-template>
