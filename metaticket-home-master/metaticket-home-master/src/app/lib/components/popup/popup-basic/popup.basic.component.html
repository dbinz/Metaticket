<!-- Overlay -->
<div *ngIf="isOpen" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <!-- Modal -->
  <div class="bg-white p-6 rounded-lg shadow-lg w-96">
    <h2 class="text-xl font-bold mb-4">{{ title }}</h2>
    <ng-container *ngIf="content"><p>{{ content }}</p></ng-container>
    <div class="mt-4 flex justify-end">
      <button class="bg-gray-300 px-4 py-2 rounded mr-2" (click)="close()">Đóng</button>
      <button class="bg-blue-500 text-white px-4 py-2 rounded" (click)="confirm()">Xác nhận</button>
    </div>
  </div>
</div>
